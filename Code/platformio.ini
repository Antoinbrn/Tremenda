; PlatformIO Project Configuration for ESP32 MP3 Player
; Build with: pio run -t upload
; Monitor with: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library Dependencies
lib_deps =
    ; Display - SSD1306 OLED
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5

    ; SD Card (built into ESP32 Arduino core)
    SD(esp32)
    SPI(esp32)

    ; Audio - Bluetooth A2DP Sink with MP3/AAC/FLAC/WAV decoding
    esphome/ESP32-audioI2S@^2.3.0
    https://github.com/pschatzmann/ESP32-A2DP
    https://github.com/pschatzmann/arduino-audio-tools.git

    ; JSON for playlist/config storage
    bblanchon/ArduinoJson@^7.0.4

    ; FreeRTOS (built into ESP32 Arduino core)

    ; Unit Testing
    throwtheswitch/Unity@^2.5.2

; Build Configuration
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -Wl,-Map=build/output.map
    -O2
    -ffunction-sections
    -fdata-sections
    -std=gnu++17

board_build.flash_mode = dio
board_build.f_cpu = 240000000L

; Custom partitions for OTA and SPIFFS
board_build.partitions = custom_partitions.csv

; Monitor filters
monitor_filters =
    esp32_exception_decoder
    time
    default

[env:esp32dev_test]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D UNITY_INCLUDE_CONFIG_H

[platformio]
default_envs = esp32dev